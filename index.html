<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGMS | ระบบแนะแนวผู้เรียน สกร.</title><style>
:root{font-family:Tahoma,'Noto Sans Thai',sans-serif;color:#18334c;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #77d8c0} .hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102d4b,#126e67);padding:20px}.loginbox{width:min(440px,100%);background:white;border-radius:24px;padding:32px;box-shadow:0 24px 80px #001a3244}.brand{font-size:27px;font-weight:800;color:#0d695f}.muted{color:#73869a;font-size:13px}.field{display:block;margin:16px 0 6px;font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #d7e2e9;border-radius:11px;background:white;color:#1d3447}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:11px;background:#117f70;color:white;padding:11px 17px;font-weight:700}.btn:hover{background:#096c60}.btn.secondary{background:#e8f4f2;color:#126a60}.btn.outline{border:1px solid #bfd4d9;background:white;color:#145569}.btn:disabled{opacity:.45;cursor:not-allowed}.small{font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:260px;background:#102f4d;color:white;padding:22px 14px;flex-shrink:0}.sidebrand{font-size:22px;font-weight:800;margin:3px 12px 25px}.sidebrand small{display:block;font-size:11px;font-weight:400;color:#b7cddd;margin-top:5px}.nav{width:100%;display:block;text-align:left;background:transparent;color:#d8e7f0;border:0;padding:13px 14px;border-radius:10px;margin:3px 0}.nav:hover,.nav.active{background:#1b5369;color:white}.main{flex:1;min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid #e3ebf0;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{padding:28px;max-width:1300px;margin:auto}h1{font-size:25px;margin:0 0 7px}h2{font-size:18px;margin:0 0 17px}h3{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}.card{background:white;border:1px solid #e1e9ee;border-radius:17px;padding:21px;box-shadow:0 4px 20px #1b425007}.metric{font-size:32px;font-weight:800;color:#126d65;margin:8px 0}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.pill{display:inline-block;background:#e3f5ed;color:#176a52;padding:5px 10px;border-radius:30px;font-size:12px}.pill.amber{background:#fff3d8;color:#996100}.pill.blue{background:#e6f0fb;color:#315f9b}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.stack{display:grid;gap:11px}.item{border:1px solid #e6edf0;border-radius:12px;padding:13px}.bar{height:10px;background:#e8eff1;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#15927b}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:550px}th,td{text-align:left;border-bottom:1px solid #e7edf1;padding:12px;font-size:13px}th{background:#f5f9fb}.notice{background:#edf8f5;border:1px solid #d5eae4;border-radius:12px;padding:14px;color:#276c5f;font-size:13px;margin:15px 0}.question{padding:15px 0;border-bottom:1px solid #e5edf1}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choices label{border:1px solid #dbe7e9;border-radius:10px;padding:8px 12px;cursor:pointer}.choices label:has(input:checked){background:#dcf4eb;border-color:#1c9278}.choices input{width:auto;margin-right:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #cfe0e4;border-radius:10px;background:white;padding:9px 14px;color:#28576a}.tab.active{background:#146f67;color:white}.logout{background:#edf2f6;color:#375269}.demo{background:#fff4d9;color:#805a0c;border-radius:9px;padding:8px 12px;font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.empty{padding:30px;text-align:center;color:#748798}.footer{font-size:12px;color:#7b8d9b;margin:30px 0}.mobilemenu{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{width:215px}.content{padding:20px}}@media(max-width:650px){.sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:5;width:260px;box-shadow:0 0 0 100vmax #0007}.sidebar.open{display:block}.mobilemenu{display:inline-block}.topbar{padding:0 15px;height:65px}.content{padding:16px}.grid{gap:10px}.card{padding:15px}.metric{font-size:27px}h1{font-size:21px}.loginbox{padding:23px}}
</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand">🎓 SGMS</div><h2 style="margin-top:12px">ระบบแนะแนวผู้เรียนออนไลน์</h2><p class="muted">สำหรับนักศึกษา สกร. ระดับการศึกษาขั้นพื้นฐาน</p><div class="notice">🧪 เว็บไซต์ต้นแบบ • ข้อมูลและบัญชีทั้งหมดเป็นข้อมูลสมมติ ไม่ต้องใช้รหัสผ่านจริง</div><label class="field">เข้าสู่ระบบในบทบาท</label><select id="role"><option value="teacher">👩‍🏫 ครูที่ปรึกษา</option><option value="student">🎓 นักศึกษา</option></select><label class="field">บัญชีสาธิต</label><input value="demo@sgms.local" readonly><label class="field">รหัสผ่านสาธิต</label><input value="demo1234" readonly><button class="btn" style="width:100%;margin-top:20px" onclick="login()">เข้าสู่ระบบสาธิต →</button><p class="muted" style="text-align:center">ไม่มีการยืนยันตัวตนหรือส่งข้อมูลออกจากอุปกรณ์</p></div></div><div id="app" class="app hidden"><aside class="sidebar" id="sidebar"><div class="sidebrand">🎓 SGMS<small>STUDENT GUIDANCE SYSTEM</small></div><div id="nav"></div></aside><div class="main"><header class="topbar"><div class="row"><button class="btn secondary mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><strong id="topTitle">ภาพรวม</strong></div><div class="row"><span class="demo">ข้อมูลสาธิต</span><span id="userLabel" class="small"></span><button class="btn logout small" onclick="logout()">ออกจากระบบ</button></div></header><main id="content" class="content"></main></div></div><script>
const students=[{id:'ST001',name:'กมลชนก ใจดี',level:'ม.ปลาย',status:'ติดตาม',need:'การศึกษา'},{id:'ST002',name:'ธนกร พัฒนกิจ',level:'ม.ต้น',status:'ปกติ',need:'อาชีพ'},{id:'ST003',name:'ศิริพร แสงทอง',level:'ม.ปลาย',status:'รอนัดหมาย',need:'ส่วนตัว–สังคม'},{id:'ST004',name:'วรพล มั่นคง',level:'ประถม',status:'ปกติ',need:'การศึกษา'},{id:'ST005',name:'ปวีณา มีสุข',level:'ม.ต้น',status:'ติดตาม',need:'อาชีพ'}];
const questions=[['ฉันต้องการคำแนะนำเกี่ยวกับการวางแผนเรียนให้สำเร็จ','การศึกษา'],['ฉันต้องการข้อมูลเกี่ยวกับการศึกษาต่อ','การศึกษา'],['ฉันต้องการคำแนะนำในการพัฒนาทักษะอาชีพ','อาชีพ'],['ฉันต้องการความช่วยเหลือในการวางแผนอาชีพ','อาชีพ'],['ฉันต้องการคำปรึกษาเกี่ยวกับปัญหาในชีวิตประจำวัน','ส่วนตัว–สังคม'],['ฉันต้องการคำแนะนำเรื่องความสัมพันธ์หรือการปรับตัว','ส่วนตัว–สังคม']];
let role='',page='dashboard',answers={},assessment=null,requests=[{id:1,name:'กมลชนก ใจดี',topic:'วางแผนการเรียน',channel:'พบครู',date:'2026-11-18',status:'รอรับเรื่อง'},{id:2,name:'ศิริพร แสงทอง',topic:'การปรับตัว',channel:'ออนไลน์',date:'2026-11-20',status:'นัดหมายแล้ว'}],plans=[{name:'กมลชนก ใจดี',goal:'จัดตารางเรียนและส่งงานให้ครบ',due:'2026-12-10',status:'กำลังดำเนินการ'},{name:'ปวีณา มีสุข',goal:'สำรวจหลักสูตรพัฒนาทักษะอาชีพ',due:'2026-12-15',status:'กำลังดำเนินการ'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){role=document.getElementById('role').value;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');page='dashboard';render()}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('sidebar').classList.remove('open')}
const menu={teacher:[['dashboard','▦ Dashboard'],['students','👥 รายชื่อนักศึกษา'],['assess','📝 ผลแบบประเมิน'],['requests','💬 คำขอปรึกษา'],['plans','🗺️ แผนและติดตามผล']],student:[['dashboard','▦ หน้าหลักของฉัน'],['profile','👤 ข้อมูลของฉัน'],['assess','📝 แบบประเมิน'],['requests','💬 ขอรับคำปรึกษา'],['plans','🗺️ แผนพัฒนาของฉัน']]};
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');render()}
function render(){document.getElementById('nav').innerHTML=menu[role].map(([id,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('userLabel').textContent=role==='teacher'?'ครูที่ปรึกษา':'นักศึกษาสาธิต';document.getElementById('topTitle').textContent=menu[role].find(x=>x[0]===page)?.[1]||'';document.getElementById('content').innerHTML=({dashboard:dashboard,students:studentList,profile:profile,assess:assess,requests:requestPage,plans:planPage}[page]||dashboard)()+`<div class="footer">SGMS Prototype • ข้อมูลสาธิตในหน่วยความจำของหน้าเว็บเท่านั้น • รีเฟรชแล้วข้อมูลที่กรอกจะเริ่มใหม่</div>`}
const metric=(n,label)=>`<div class="card"><div class="muted">${label}</div><div class="metric">${n}</div></div>`;
function dashboard(){return role==='teacher'?`<h1>ภาพรวมการแนะแนว 👩‍🏫</h1><p class="muted">ภาคเรียนที่ 2/2569 • ข้อมูลสาธิตเพื่อทดสอบระบบ</p><div class="grid">${metric('120','นักศึกษาที่รับผิดชอบ')}${metric('96','ทำแบบประเมินแล้ว')}${metric(requests.filter(x=>x.status==='รอรับเรื่อง').length,'คำขอรอรับเรื่อง')}${metric(plans.filter(x=>x.status==='กำลังดำเนินการ').length,'แผนที่กำลังติดตาม')}</div><div class="two"><div class="card"><h2>การประเมินความต้องการแนะแนว</h2><p class="muted">96 จาก 120 คน (80%)</p><div class="bar"><div style="width:80%"></div></div><h3 style="margin-top:24px">ความต้องการรายด้าน (ข้อมูลสมมติ)</h3>${[['การศึกษา',65],['อาชีพ',48],['ส่วนตัว–สังคม',27]].map(([n,v])=>`<div style="margin:15px 0"><div class="row small"><span>${n}</span><b>${v} คน</b></div><div class="bar" style="margin-top:6px"><div style="width:${v/70*100}%"></div></div></div>`).join('')}<p class="muted">นักศึกษาหนึ่งคนอาจเลือกได้หลายด้าน</p></div><div class="card"><h2>รายการที่ต้องดำเนินการ</h2><div class="stack">${requests.map(r=>`<div class="item"><div class="row"><b>${esc(r.name)}</b><span class="pill ${r.status==='รอรับเรื่อง'?'amber':''}">${esc(r.status)}</span></div><div class="muted">${esc(r.topic)} • ${esc(r.date)}</div></div>`).join('')}</div><div class="actions"><button class="btn" onclick="go('requests')">จัดการคำขอ →</button></div></div></div>`:`<h1>สวัสดี นักศึกษา 👋</h1><p class="muted">พื้นที่ค้นหาตนเอง วางแผนการเรียนและอนาคต</p><div class="grid">${metric(assessment?'เสร็จแล้ว':'ยังไม่ทำ','แบบประเมิน G-02')}${metric(requests.filter(r=>r.name==='นักศึกษาสาธิต').length,'คำขอคำปรึกษาของฉัน')}${metric(1,'แผนพัฒนาตัวอย่าง')}${metric('3 ด้าน','บริการแนะแนว')}</div><div class="two"><div class="card"><h2>เริ่มต้นการแนะแนว</h2><p>สำรวจความต้องการของตนเองด้านการศึกษา อาชีพ และการใช้ชีวิต</p><div class="actions"><button class="btn" onclick="go('assess')">ทำแบบประเมิน →</button><button class="btn secondary" onclick="go('requests')">ขอรับคำปรึกษา</button></div></div><div class="card"><h2>ขั้นตอนการใช้งาน</h2><div class="stack"><div class="item">① ตรวจสอบข้อมูลของฉัน</div><div class="item">② ทำแบบประเมินความต้องการ</div><div class="item">③ ส่งคำขอปรึกษาและติดตามแผน</div></div></div></div>`}
function studentList(){return `<h1>รายชื่อนักศึกษา</h1><p class="muted">ตัวอย่าง 5 รายชื่อ จากกลุ่มสมมติ 120 คน</p><div class="card"><label class="field">ค้นหาชื่อหรือระดับการศึกษา</label><input id="search" placeholder="ค้นหานักศึกษา..." oninput="filterStudents()"><div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อ–สกุล</th><th>ระดับ</th><th>ประเด็นแนะแนว</th><th>สถานะ</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`}
function filterStudents(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('studentRows').innerHTML=students.filter(s=>Object.values(s).some(v=>String(v).toLowerCase().includes(q))).map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.level}</td><td>${s.need}</td><td><span class="pill ${s.status==='ติดตาม'?'amber':''}">${s.status}</span></td></tr>`).join('')||'<tr><td colspan="5">ไม่พบข้อมูล</td></tr>'}
function profile(){return `<h1>ข้อมูลของฉัน</h1><div class="card"><h2>Student Guidance Profile</h2><div class="notice">ข้อมูลทั้งหมดในหน้านี้เป็นข้อมูลสมมติ</div><div class="stack"><div class="item"><b>ชื่อ</b><p>นักศึกษาสาธิต</p></div><div class="item"><b>ระดับการศึกษา</b><p>มัธยมศึกษาตอนปลาย</p></div><div class="item"><b>ครูที่ปรึกษา</b><p>ครูที่ปรึกษาสาธิต</p></div><div class="item"><b>เป้าหมาย</b><p>วางแผนเรียนให้สำเร็จและพัฒนาทักษะอาชีพ</p></div></div></div>`}
function assess(){return role==='teacher'?`<h1>ผลแบบประเมิน</h1><div class="grid">${metric('96','ผู้ทำแบบประเมินแล้ว')}${metric('24','ยังไม่ได้ประเมิน')}${metric('80%','อัตราการตอบ')}${metric('3','ด้านที่สำรวจ')}</div><div class="card"><h2>เกี่ยวกับแบบประเมิน G-02</h2><p>แบบสำรวจความต้องการแนะแนวด้านการศึกษา อาชีพ และส่วนตัว–สังคม</p><p class="notice">คะแนนความต้องการสูงไม่ใช่การวินิจฉัยหรือการระบุความเสี่ยงทางจิตใจ</p><button class="btn secondary" onclick="alert('ในต้นแบบนี้ ครูดูผลรวมสาธิตได้เท่านั้น')">ดูคำอธิบาย</button></div>`:`<h1>แบบประเมินความต้องการแนะแนว</h1><p class="muted">G-02 • ตัวอย่าง 6 ข้อ • เลือกระดับความต้องการ 1 (น้อยที่สุด) ถึง 5 (มากที่สุด)</p><div class="card"><div class="notice">คำถามสาธิต ยังไม่ผ่านการตรวจสอบคุณภาพเครื่องมือ และไม่ใช่แบบวินิจฉัย</div>${questions.map(([q,cat],i)=>`<div class="question"><b>${i+1}. ${q}</b><div class="muted">ด้าน${cat}</div><div class="choices">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="q${i}" value="${v}" ${answers[i]===v?'checked':''} onchange="answers[${i}]=${v}">${v}</label>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" onclick="submitAssess()">คำนวณผลประเมิน</button><button class="btn outline" onclick="answers={};assessment=null;render()">เริ่มใหม่</button></div><div id="result">${assessment?resultHTML():''}</div></div>`}
function resultHTML(){return `<div class="notice"><b>ผลประเมินตัวอย่าง</b><p>คะแนนสูงแปลว่าต้องการคำแนะนำด้านนั้นมาก ไม่ใช่ระดับความรุนแรงของปัญหา</p>${Object.entries(assessment).map(([k,v])=>`<div style="margin:12px 0"><div class="row"><span>${k}</span><b>${v.toFixed(1)} / 5</b></div><div class="bar"><div style="width:${v*20}%"></div></div></div>`).join('')}</div>`}
function submitAssess(){if(questions.some((_,i)=>!answers[i])){alert('กรุณาตอบให้ครบทั้ง 6 ข้อ');return}assessment={};for(let c of ['การศึกษา','อาชีพ','ส่วนตัว–สังคม'])assessment[c]=questions.reduce((n,q,i)=>n+(q[1]===c?answers[i]:0),0)/2;document.getElementById('result').innerHTML=resultHTML();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function requestPage(){return role==='student'?`<h1>ขอรับคำปรึกษา</h1><p class="muted">ส่งคำขอปรึกษาเพื่อทดสอบขั้นตอน ไม่มีการส่งข้อมูลจริง</p><div class="two"><div class="card"><h2>แบบฟอร์มคำขอ</h2><label class="field">หัวข้อ</label><select id="topic"><option>การเรียนและการศึกษาต่อ</option><option>อาชีพและการทำงาน</option><option>ส่วนตัวและการใช้ชีวิต</option><option>อื่น ๆ</option></select><label class="field">ช่องทาง</label><select id="channel"><option>พบครู</option><option>โทรศัพท์</option><option>ออนไลน์</option></select><label class="field">วันที่สะดวก</label><input id="date" type="date"><label class="field">รายละเอียดเบื้องต้น (ไม่จำเป็น)</label><textarea id="detail" placeholder="ไม่ต้องระบุข้อมูลส่วนตัวที่ละเอียดอ่อน"></textarea><div class="actions"><button class="btn" onclick="addRequest()">ส่งคำขอจำลอง</button></div></div><div class="card"><h2>คำขอของฉัน</h2><div class="stack">${requests.filter(r=>r.name==='นักศึกษาสาธิต').map(requestItem).join('')||'<div class="empty">ยังไม่มีคำขอ</div>'}</div></div></div>`:`<h1>จัดการคำขอคำปรึกษา</h1><p class="muted">รายการข้อมูลสมมติ • สามารถกดรับเรื่องและเปลี่ยนสถานะได้</p><div class="card"><div class="stack">${requests.map(r=>`<div class="item"><div class="row"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.topic)} • ${esc(r.channel)} • ${esc(r.date)}</div></div><span class="pill ${r.status==='รอรับเรื่อง'?'amber':''}">${esc(r.status)}</span></div><div class="actions"><button class="btn secondary" onclick="updateRequest(${r.id},'นัดหมายแล้ว')">ยืนยันนัดหมาย</button><button class="btn outline" onclick="updateRequest(${r.id},'อยู่ระหว่างติดตาม')">เริ่มติดตาม</button><button class="btn outline" onclick="updateRequest(${r.id},'ปิดกรณี')">ปิดกรณี</button></div></div>`).join('')}</div></div>`}
function requestItem(r){return `<div class="item"><b>${esc(r.topic)}</b><p class="muted">${esc(r.date)} • ${esc(r.channel)}</p><span class="pill">${esc(r.status)}</span></div>`}
function addRequest(){let date=document.getElementById('date').value;if(!date){alert('กรุณาเลือกวันที่สะดวก');return}requests.push({id:Math.max(...requests.map(r=>r.id),0)+1,name:'นักศึกษาสาธิต',topic:document.getElementById('topic').value,channel:document.getElementById('channel').value,date,status:'รอรับเรื่อง'});render();alert('บันทึกคำขอในต้นแบบแล้ว (ไม่ส่งไปยังครูจริง)')}
function updateRequest(id,status){let r=requests.find(x=>x.id===id);if(r){r.status=status;render()}}
function planPage(){return role==='teacher'?`<h1>แผนแนะแนวและติดตามผล</h1><p class="muted">เพิ่มและปรับสถานะแผนสาธิตได้</p><div class="card"><h2>แผนรายบุคคล</h2><div class="stack">${plans.map((p,i)=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span class="pill ${p.status==='กำลังดำเนินการ'?'amber':''}">${esc(p.status)}</span></div><p>${esc(p.goal)}</p><div class="muted">ครบกำหนด ${esc(p.due)}</div><div class="actions"><button class="btn secondary" onclick="plans[${i}].status='บรรลุเป้าหมาย';render()">บรรลุเป้าหมาย</button><button class="btn outline" onclick="plans[${i}].status='กำลังดำเนินการ';render()">ดำเนินการต่อ</button></div></div>`).join('')}</div><h3 style="margin-top:22px">เพิ่มแผนสาธิต</h3><label class="field">นักศึกษา</label><select id="planStudent">${students.map(s=>`<option>${s.name}</option>`).join('')}</select><label class="field">เป้าหมาย</label><input id="goal" placeholder="เป้าหมายที่วัดผลได้"><label class="field">วันติดตาม</label><input id="due" type="date"><div class="actions"><button class="btn" onclick="addPlan()">เพิ่มแผน</button></div></div>`:`<h1>แผนพัฒนาของฉัน</h1><div class="card"><h2>ตัวอย่างแผนพัฒนารายบุคคล</h2><div class="notice">แผนนี้เป็นตัวอย่าง ไม่ใช่ข้อมูลของนักศึกษาจริง</div><div class="item"><b>เป้าหมาย</b><p>วางแผนการเรียนให้สำเร็จภายในภาคเรียน</p><b>กิจกรรม</b><p>จัดตารางเรียนประจำสัปดาห์และทบทวนความก้าวหน้ากับครู</p><b>สถานะ</b><p><span class="pill amber">กำลังดำเนินการ</span></p></div></div>`}
function addPlan(){let name=document.getElementById('planStudent').value,goal=document.getElementById('goal').value.trim(),due=document.getElementById('due').value;if(!goal||!due){alert('กรุณาระบุเป้าหมายและวันติดตาม');return}plans.push({name,goal,due,status:'กำลังดำเนินการ'});render()}
const oldRender=render;render=function(){oldRender();if(page==='students'&&role==='teacher')filterStudents()};
</script></body></html>
